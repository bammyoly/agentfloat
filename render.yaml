# ===========================================================================
# Render blueprint — AgentFloat gateway web service (Free Tier)
# ===========================================================================

services:
  - type: web
    name: agentfloat-gateway
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm --prefix server install
    startCommand: npm --prefix server start
    numInstances: 1
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: "20"

      # --- bind: PaaS proxies to 0.0.0.0 and injects PORT ------------------
      - key: GATEWAY_HOST
        value: 0.0.0.0

      # --- secrets: set these in the dashboard prompt -----------------------
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: GATEWAY_SIGNER_PRIVATE_KEY
        sync: false
      - key: GATEWAY_ADMIN_TOKEN
        sync: false

      # --- CORS: who may call this gateway from a browser -------------------
      - key: GATEWAY_ALLOWED_ORIGINS
        value: https://*.vercel.app

      # --- chain + seller configuration -------------------------------------
      - key: SELLER_PRICE
        value: $0.001
      - key: SELLER_PAY_TO
        sync: false
      - key: FACILITATOR_URL
        value: https://facilitator.vativ.io

      # --- optional features ------------------------------------------------
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: ALLOWED_ENDPOINTS
        sync: false
      - key: DAILY_SPEND_LOOKBACK
        value: "300"